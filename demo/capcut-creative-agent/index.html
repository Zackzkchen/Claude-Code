<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>剪映 PC · 全民创作 Agent（无限画布 MVP Demo）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ededed'/%3E%3Cpath d='M10 22V10h4l4 7 4-7h-1v12' stroke='%23111' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles/base.css" />
<link rel="stylesheet" href="./styles/canvas.css" />
<link rel="stylesheet" href="./styles/chat.css" />
<link rel="stylesheet" href="./styles/preview.css" />
</head>
<body>
  <!-- 模拟剪映 PC 客户端外壳 -->
  <div class="app-shell">
    <header class="titlebar">
      <div class="titlebar-left">
        <div class="traffic"><i></i><i></i><i></i></div>
        <div class="app-brand">
          <span class="app-logo">剪</span>
          <span class="app-name">剪映专业版</span>
        </div>
        <nav class="tab-bar">
          <button class="tab" data-noop>开始创作</button>
          <button class="tab is-active">全民创作 Agent</button>
          <button class="tab" data-noop>我的空间</button>
        </nav>
      </div>
      <div class="titlebar-right">
        <button class="icon-btn" id="btn-guide" data-tip="交互说明">?</button>
        <button class="icon-btn" id="btn-reset" data-tip="重置演示">↺</button>
        <button class="primary-btn" id="btn-autoplay">一键演示</button>
        <div class="avatar">A</div>
      </div>
    </header>

    <main class="workspace">
      <!-- 左：无限画布 -->
      <section class="canvas-pane" id="canvas-pane">
        <div class="canvas-viewport" id="viewport">
          <div class="canvas-grid" id="grid"></div>
          <div class="canvas-world" id="world">
            <svg class="edge-layer" id="edge-layer" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
                </marker>
              </defs>
              <g id="edge-paths"></g>
              <g id="edge-labels"></g>
            </svg>
            <div class="node-layer" id="node-layer"></div>
          </div>
          <div class="marquee" id="marquee" hidden></div>
        </div>

        <!-- 画布空状态 -->
        <div class="canvas-empty" id="canvas-empty" hidden>
          <div class="canvas-empty-inner">
            <div class="canvas-empty-icon">＋</div>
            <h3>从一个想法开始</h3>
            <p>双击空白处新建文本，或直接告诉右侧 Agent 你想做什么。</p>
          </div>
        </div>

        <!-- 画布左上：节点计数与 Agent 操作提示 -->
        <div class="canvas-topbar">
          <div class="canvas-meta" id="canvas-meta">0 节点</div>
          <div class="agent-cursor-hint" id="agent-busy" hidden>
            <span class="pulse"></span> Agent 正在操作画布
          </div>
        </div>

        <!-- 画布右上：视图操作（图标 + hover 提示） -->
        <div class="canvas-tools-tr">
          <button class="icon-btn" id="btn-tidy" data-tip="整理布局（按血缘层级重排）">⊞</button>
          <button class="icon-btn" id="btn-fit" data-tip="适配画面　Shift+1">⛶</button>
          <div class="zoom-group">
            <button class="icon-btn" id="btn-zoom-out" data-tip="缩小">−</button>
            <button class="zoom-label" id="btn-zoom-reset" data-tip="恢复 100%　Shift+0">100%</button>
            <button class="icon-btn" id="btn-zoom-in" data-tip="放大">＋</button>
          </div>
        </div>

        <!-- 画布底部：新增素材 -->
        <div class="canvas-dock">
          <button class="dock-btn" id="dock-text" data-tip="新建文本　也可双击画布空白处">
            <span class="dock-icon">T</span><span>文本</span>
          </button>
          <button class="dock-btn" id="dock-image" data-tip="新建图片　本地上传或 AI 生成">
            <span class="dock-icon">▣</span><span>图片</span>
          </button>
          <button class="dock-btn" id="dock-video" data-tip="新建视频　本地上传或 AI 生成">
            <span class="dock-icon">▶</span><span>视频</span>
          </button>
        </div>

        <!-- 局部放大预览页：盖住画布区，右侧对话仍可用 -->
        <div class="preview-layer" id="preview-layer" hidden>
          <header class="preview-head">
            <button class="ghost-btn small" id="preview-back">← 返回画布</button>
            <div class="preview-title">
              <span class="node-kind" id="preview-kind">T</span>
              <strong id="preview-name">节点</strong>
              <span class="node-badge" id="preview-badge"></span>
            </div>
            <div class="preview-head-right">
              <button class="icon-btn" id="preview-prev" data-tip="上一个同批产物　←">‹</button>
              <button class="icon-btn" id="preview-next" data-tip="下一个同批产物　→">›</button>
              <div class="zoom-group">
                <button class="icon-btn" id="preview-zoom-out" data-tip="缩小">−</button>
                <button class="zoom-label" id="preview-zoom-fit" data-tip="重新适配当前节点">100%</button>
                <button class="icon-btn" id="preview-zoom-in" data-tip="放大">＋</button>
              </div>
              <button class="icon-btn" id="preview-locate" data-tip="在画布中定位">⊙</button>
            </div>
          </header>
          <div class="preview-body">
            <div class="preview-stage" id="preview-stage">
              <div class="preview-world" id="preview-world">
                <svg class="edge-layer" id="preview-edge-layer" xmlns="http://www.w3.org/2000/svg">
                  <g id="preview-edge-paths"></g>
                  <g id="preview-edge-labels"></g>
                </svg>
                <div class="node-layer" id="preview-nodes"></div>
              </div>
            </div>
            <aside class="preview-side" id="preview-side"></aside>
          </div>
        </div>
      </section>

      <div class="pane-resizer" id="pane-resizer" title="拖拽调整画布 / 对话宽度"></div>

      <!-- 右：Agent 对话面板 -->
      <aside class="chat-pane" id="chat-pane">
        <header class="chat-head">
          <div class="chat-head-main">
            <div class="agent-avatar">✦</div>
            <div>
              <div class="chat-title">全民创作 Agent</div>
              <div class="chat-sub" id="chat-status">在线 · 可直接操作画布</div>
            </div>
          </div>
          <button class="ghost-btn small" id="btn-clear-chat">清空对话</button>
        </header>

        <div class="chat-scroll" id="chat-scroll"></div>

        <footer class="chat-composer">
          <div class="context-bar" id="context-bar" hidden></div>
          <div class="quick-chips" id="quick-chips"></div>
          <div class="composer-box">
            <textarea id="chat-input" rows="1" placeholder="描述你的创作需求，例如：帮我做一条国风护手霜的短视频"></textarea>
            <button class="send-btn" id="btn-send" title="发送 Enter">发送</button>
          </div>
        </footer>
      </aside>
    </main>
  </div>

  <!-- 交互说明弹层 -->
  <div class="modal-mask" id="guide-modal" hidden>
    <div class="modal">
      <header>
        <h3>MVP 无限画布 · 最小交互集</h3>
        <button class="ghost-btn small" id="btn-guide-close">关闭</button>
      </header>
      <div class="modal-body" id="guide-body"></div>
    </div>
  </div>

  <input type="file" id="file-image" accept="image/*" hidden />
  <input type="file" id="file-video" accept="video/*" hidden />

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="./scripts/util.js"></script>
  <script src="./scripts/ui.js"></script>
  <script src="./scripts/media.js"></script>
  <script src="./scripts/store.js"></script>
  <script src="./scripts/canvas.js"></script>
  <script src="./scripts/preview.js"></script>
  <script src="./scripts/generate.js"></script>
  <script src="./scripts/chat.js"></script>
  <script src="./scripts/agent.js"></script>
  <script src="./scripts/app.js"></script>
</body>
</html>
